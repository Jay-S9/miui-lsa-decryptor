name: Build Windows EXE

# Triggers:
# 1. Every time you publish a GitHub Release -> attaches the .exe (+ SHA-256 checksum) to it
# 2. Manual trigger from the Actions tab (builds and uploads an artifact only; never touches a release)
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: nothing can write by default. Only the publish job below raises this for itself.
permissions:
  contents: read

jobs:
  # ── Job 1: build. Installs third-party packages, so it gets a READ-ONLY token and no stored git credentials ──
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome customtkinter pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      # Lets users verify that the file they downloaded is the file this workflow built
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/LSA-Decryptor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LSA-Decryptor.exe" | Out-File -FilePath dist/LSA-Decryptor.exe.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LSA-Decryptor-Windows
          path: |
            dist/LSA-Decryptor.exe
            dist/LSA-Decryptor.exe.sha256
          retention-days: 30

  # ── Job 2: publish. Runs only for real releases, builds nothing, and is the ONLY job with write access ──
  publish-release:
    if: github.event_name == 'release'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # required to attach files to the release
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LSA-Decryptor-Windows
          path: dist

      - name: Attach EXE and checksum to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/LSA-Decryptor.exe
            dist/LSA-Decryptor.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
