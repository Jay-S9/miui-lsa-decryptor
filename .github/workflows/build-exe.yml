name: Build Windows EXE

# Triggers:
# 1. Every time you publish a GitHub Release → attaches .exe to it automatically
# 2. Manual trigger from GitHub Actions tab (for testing)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write       # Required to upload assets to GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome customtkinter pyinstaller

      # ── 4. Build .exe ────────────────────────────────────────────────────
      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      # ── 5. Upload .exe as workflow artifact (available in Actions tab) ───
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LSA-Decryptor-Windows
          path: dist/LSA-Decryptor.exe
          retention-days: 30

      # ── 6. Attach .exe to GitHub Release (only on release trigger) ───────
      - name: Upload EXE to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LSA-Decryptor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
